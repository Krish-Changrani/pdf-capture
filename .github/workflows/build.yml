# Builds PDF Capture on a GitHub-hosted Windows machine, as a FOLDER (not a single exe),
# so it starts fast and never unpacks itself to a temp folder.
# Nothing needs to be installed on your own laptop.
#
#   Actions tab > "Build PDF Capture" > Run workflow
#     -> builds the app AND creates a new release (v1.1, v1.2, ...) with PDFCapture.zip attached.
#   Sharing link that always points at the newest version:
#     https://github.com/<your-username>/<repo-name>/releases/latest/download/PDFCapture.zip
#
#   (Publishing a release by hand also still works: the zip is attached once the run finishes.)

name: Build PDF Capture

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pillow numpy

      - name: Check the script is valid
        run: python -c "import ast; ast.parse(open('PDFCapture.pyw').read()); print('script OK')"

      - name: Build the app folder
        run: pyinstaller --onedir --noconsole --name PDFCapture PDFCapture.pyw

      - name: Check the build and zip it
        shell: pwsh
        run: |
          if (!(Test-Path dist/PDFCapture/PDFCapture.exe)) { Write-Error "PDFCapture.exe was not created"; exit 1 }
          if (!(Test-Path dist/PDFCapture/_internal)) { Write-Error "_internal folder was not created"; exit 1 }
          Compress-Archive -Path dist/PDFCapture/* -DestinationPath PDFCapture.zip   # contents only, so Extract All gives one PDFCapture folder
          "Built PDFCapture.zip: {0:N1} MB" -f ((Get-Item PDFCapture.zip).Length / 1MB)

      - name: Save the zip on this run's page
        uses: actions/upload-artifact@v4
        with:
          name: PDFCapture-zip
          path: PDFCapture.zip

      - name: Create a release with the zip attached (Run workflow button)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: PDF Capture v1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: PDFCapture.zip

      - name: Attach the zip to a release you published by hand
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: PDFCapture.zip
